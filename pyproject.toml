[project]
name = "llm"
version = "0.1.0"
description = "Minimal LLM from scratch: pretrain, SFT, RL, OPD on Apple Silicon"
authors = [
    { name = "maokaihe", email = "ecrofmaomao@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "trl>=1.15.0",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true